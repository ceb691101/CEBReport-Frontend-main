server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression for faster loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Static asset caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # API Proxy definitions (mirroring vite.config.ts)
    location /smsapi/ {
        proxy_pass http://10.128.1.126/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /CBRSAPI/ {
        proxy_pass http://10.128.1.126/CBRSAPI/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /CEBINFO_API_2025/ {
        proxy_pass http://10.128.1.126/CEBINFO_API_2025/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /misapi/ {
        proxy_pass http://10.128.1.126/misapi/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://10.128.1.126/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /SMART_API/ {
        proxy_pass http://smartceb.ceb:81/SMART_API/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /MRMSAPI/ {
        proxy_pass http://itservice.cebinfo.ceb/MRMSAPI/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA routing: fallback to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
